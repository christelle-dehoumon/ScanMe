# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-json
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/google/dart-format
    rev: v2.17.0
    hooks:
      - id: dart-format
        args: [--line-length=120]

  - repo: local
    hooks:
      - id: flutter-analyze
        name: Flutter Analyze
        entry: flutter analyze
        language: system
        types: [dart]
        pass_filenames: false
        always_run: true
        stages: [commit]

      - id: flutter-test
        name: Flutter Test
        entry: flutter test
        language: system
        types: [dart]
        pass_filenames: false
        stages: [commit]
        required: false
